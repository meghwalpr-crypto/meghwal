<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Class 5 TWAU Energy Quiz</title><style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:linear-gradient(135deg,#e8f4f1,#fff2d9);font-family:Arial,sans-serif;color:#19354b}
main{max-width:760px;margin:24px auto;background:white;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px #1233}
header{background:#17324d;color:white;text-align:center;padding:24px}header h1{margin:0 0 8px}header p{margin:0;color:#ffe0a5}
section{padding:24px}.meta{display:flex;justify-content:space-between;font-weight:bold;color:#536779}.bar{height:9px;background:#e7edf0;border-radius:9px;margin:14px 0 24px}.fill{height:100%;background:#e68a24;border-radius:9px}
h2{line-height:1.4}.opts{display:grid;gap:10px;margin:20px 0}.opt{display:flex;gap:10px;padding:14px;border:2px solid #dce5e9;border-radius:11px;cursor:pointer}.opt:has(input:checked){border-color:#17324d;background:#eff6f8}
button{border:0;border-radius:9px;background:#e68a24;color:#172d40;padding:12px 20px;font-weight:bold;font-size:16px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.actions{text-align:right}.feedback{padding:14px;border-radius:10px;margin:16px 0;line-height:1.5}.good{background:#e8f6ee}.bad{background:#fff0ed}.result{text-align:center;padding:28px}.score{font-size:48px;color:#287a55;font-weight:bold}
</style></head><body><main><header><h1>⚡ Energy – How Things Work</h1><p>Class 5 • TWAU • Chapter 7</p></header><section id="app"></section></main>
<script>
const qs=[["What does energy help things do?", ["Only become heavier", "Move, produce light, sound or heat", "Change colour only", "Disappear"], 1, "Energy makes changes happen: movement, light, sound and changes in temperature."], ["A fan is rotating. What change can you observe?", ["Movement", "Freezing", "No change", "Only a colour change"], 0, "The fan blades move. This is an everyday example of energy producing movement."], ["Which object is commonly used to produce sound?", ["A bell", "A pillow", "A closed book", "A glass of water"], 0, "A bell produces sound when it vibrates."], ["Why can a plucked rubber band make a sound?", ["It melts", "It vibrates", "It becomes hot", "It disappears"], 1, "Plucking makes the rubber band vibrate, and vibrations produce sound."], ["In the balloon air-rocket activity, what makes the balloon move?", ["Its colour", "Air rushing out", "The table", "Its sound"], 1, "Air rushing out pushes the balloon forward along the string."], ["Which cup of water is expected to become warmer: one in sunlight or one in shade?", ["Sunlight", "Shade", "Both freeze", "Neither can change"], 0, "Sunlight provides heat energy and warms the water."], ["A glowing bulb is an example of energy producing:", ["Movement", "Light", "Cooling", "Freezing"], 1, "A glowing bulb gives light."], ["A ringing bell and a moving fan show:", ["Only movement", "Sound from the bell and movement from the fan", "Only heat", "No energy"], 1, "The bell is noticed through sound; the fan is noticed through movement."], ["What observation supports the idea that moving air can make things move?", ["The balloon is colourful", "Air rushes out and the balloon travels", "The string is long", "The balloon is rubber"], 1, "The balloon moves as air rushes out of its opening."], ["How can we fairly compare sunlight and shade on water?", ["Use different amounts of water", "Use equal amounts in similar cups; keep one in sunlight and one in shade", "Start with hot water in one cup", "Keep both cups in sunlight"], 1, "Keep other conditions similar so sunlight or shade is the main difference."], ["A cooker heats food, a fan moves and a bell rings. What connects these examples?", ["Energy causes changes", "All are made of metal", "All need direct sunlight", "All make the same effect"], 0, "Heating, movement and sound are different changes involving energy."], ["What is the best conclusion from the three activities?", ["Only balloons use energy", "Energy can be noticed through movement, sound and heat", "Sound and heat are identical", "The Sun cannot warm water"], 1, "The balloon shows movement, the rubber band produces sound, and sunlight warms water."]];let n=0,choice=null,score=0,checked=false;
function draw(){let a=document.getElementById('app');if(n===qs.length){let p=Math.round(score/qs.length*100);a.innerHTML=`<div class="result"><div style="font-size:48px">🏆</div><h2>Quiz completed!</h2><div class="score">${score} / ${qs.length}</div><p>${p}% correct</p><p>${p>=85?'Excellent work!':p>=60?'Good effort! Read the explanations and practise again.':'Keep exploring! Review the activities and try once more.'}</p><button onclick="restart()">Try again</button></div>`;return}
let q=qs[n];a.innerHTML=`<div class="meta"><span>Question ${n+1} of ${qs.length}</span><span>${n<3?'Easy':n<7?'Moderate':'Challenge'}</span></div><div class="bar"><div class="fill" style="width:${n/qs.length*100}%"></div></div><h2>${q[0]}</h2><p>Choose the best answer.</p><div class="opts">${q[1].map((v,i)=>`<label class="opt"><input type="radio" name="a" value="${i}" ${choice===i?'checked':''} ${checked?'disabled':''}>${String.fromCharCode(65+i)}. ${v}</label>`).join('')}</div>${checked?`<div class="feedback ${choice===q[2]?'good':'bad'}"><b>${choice===q[2]?'Correct!':'Not quite.'}</b> ${q[3]}</div>`:''}<div class="actions">${checked?`<button onclick="next()">${n===qs.length-1?'See result':'Next question →'}</button>`:`<button id="check" onclick="submit()" ${choice===null?'disabled':''}>Check answer</button>`}</div>`;
a.querySelectorAll('input[name=a]').forEach(x=>x.addEventListener('change',e=>{choice=+e.target.value;draw()}))}
function submit(){if(choice===null)return;checked=true;if(choice===qs[n][2])score++;draw()}
function next(){n++;choice=null;checked=false;draw()}
function restart(){n=0;choice=null;checked=false;score=0;draw()}
draw();
</script></section></main></body></html>
